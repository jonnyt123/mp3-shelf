name: iOS Xcode Build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
jobs:
  xcode-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build iPhone simulator app without signing
        run: |
          xcodebuild -project ios/MP3Shelf.xcodeproj -scheme MP3Shelf -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Playlist parser regression tests
        run: |
          swiftc ios/MP3Shelf/Models/MusicModels.swift ios/MP3Shelf/Services/PlaylistCSV.swift ios/Tests/PlaylistCSVTests.swift -o /tmp/mp3shelf-playlist && /tmp/mp3shelf-playlist
      - name: Lyrics parser regression tests
        run: |
          swiftc ios/MP3Shelf/Services/LyricsParser.swift ios/Tests/LyricsParserTests.swift -o /tmp/mp3shelf-lyrics && /tmp/mp3shelf-lyrics
      - name: Licensed MP3 source matching regression tests
        run: |
          swiftc ios/MP3Shelf/Models/MusicModels.swift ios/MP3Shelf/Services/PlaylistCSV.swift ios/MP3Shelf/Services/AudioSourceFinder.swift ios/Tests/AudioSourceFinderTests.swift -o /tmp/mp3shelf-source-finder && /tmp/mp3shelf-source-finder
      - name: Persistent discovery resume regression tests
        run: |
          swiftc ios/MP3Shelf/Models/MusicModels.swift ios/MP3Shelf/Models/SourceDiscoveryJob.swift ios/Tests/SourceDiscoveryJobTests.swift -o /tmp/mp3shelf-discovery && /tmp/mp3shelf-discovery
      - name: Install and launch iPhone Simulator app
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > /tmp/mp3shelf-simulators.json
          DEVICE=$(python3 - <<'PY'
          import json
          with open('/tmp/mp3shelf-simulators.json') as f:
              data=json.load(f)
          for runtime, devices in data.get('devices', {}).items():
              for device in devices:
                  if 'iPhone' in device.get('name', '') and device.get('isAvailable', False):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator installed')
          PY
          )
          if ! xcrun simctl list devices | grep "$DEVICE" | grep -q "Booted"; then
            xcrun simctl boot "$DEVICE"
          fi
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/MP3Shelf.app' -type d -print -quit)
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p "$RUNNER_TEMP/mp3shelf-visual-qa"
          # Each tab is opened in a fresh process using debug-only launch
          # arguments. This does not introduce demo content into releases.
          for tab in listen playlists add-music settings; do
            if [ "$tab" = "listen" ]; then
              xcrun simctl launch "$DEVICE" com.jonnyt.mp3shelf
            else
              xcrun simctl launch "$DEVICE" com.jonnyt.mp3shelf --mp3shelf-snapshot-"$tab"
            fi
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/mp3shelf-visual-qa/$tab.png"
            xcrun simctl terminate "$DEVICE" com.jonnyt.mp3shelf
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp3shelf-premium-all-tabs
          path: ${{ runner.temp }}/mp3shelf-visual-qa/*.png
          if-no-files-found: ignore
