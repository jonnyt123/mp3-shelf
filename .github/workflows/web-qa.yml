name: Web app verification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-qa.yml'
  workflow_dispatch:
concurrency:
  group: web-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript type check
        run: npm run typecheck
      - name: Production Next.js build
        run: npm run build
